<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>GameClub - Cadastro</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="game_club_cartridge_icon.ico">
<script src="utils.js" defer></script>
<script src="auth.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="header card">
      <div class="brand"><div class="logo"><img src="logo.png" alt="Logo GameClub" class="logo-img"></div><div><div>GAMECLUB</div><div class="small muted">Mercado de usados</div></div></div>
      <button id="themeToggle" class="toggle">☀️/🌙</button>
    </div>
    
    <div class="card" style="margin-top:16px;">
      <h2>Cadastro</h2>
      <form id="registerForm">
        <div class="form-grid">
          <div>
            <label class="small muted">Nome</label>
            <input id="regName" required>
            <label class="small muted">Email</label>
            <input id="regEmail" type="email" required>
            <label class="small muted">Senha</label>
            <input id="regPass" type="password" required>
            <label class="small muted">Data de Nascimento</label>
            <input id="regBirth" type="date">
          </div>
          <div>
            <label class="small muted">CPF</label>
            <input id="regCPF" required>
            <label class="small muted">Celular</label>
            <input id="regPhone" required>
            <label class="small muted">CEP</label>
            <input id="regCEP" required>
            <label class="small muted">Endereço (preenchido automaticamente)</label>
            <input id="regAddress" disabled required>
          </div>
        </div>
        <br>
        <button type="submit">Criar Conta</button>
        <br>
        <br>  
        <div class="header-right"><a href="index.html" class="badge">Voltar</a></div>
      </form>
    </div>
  </div>
  <script>(function(){ const t=localStorage.getItem('theme')||'dark'; if(t==='light') document.documentElement.setAttribute('data-theme','light'); document.getElementById('themeToggle').addEventListener('click', ()=>{ const cur=document.documentElement.getAttribute('data-theme'); const next=cur==='light'?'':'light'; if(next) document.documentElement.setAttribute('data-theme','light'); else document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', next?'light':'dark'); }); })();</script>
</body>
</html>
