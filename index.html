<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><title>GameClub - Login</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="game_club_cartridge_icon.ico">
<script src="utils.js" defer></script>
<script src="auth.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="header card">
      <div class="brand"><div class="logo"><img src="logo.png" alt="Logo GameClub" class="logo-img"></div><div><div>GAMECLUB</div><div class="small muted">Mercado de usados</div></div></div>
      <div class="header-right"><a href="register.html" class="badge">Criar conta</a></div>
      <button id="themeToggle" class="toggle">☀️/🌙</button>
    </div>

    <div class="card" style="margin-top:16px;">
      <h2>Entrar</h2>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPass" placeholder="Senha" required>
        <br>
        <br>
        <button type="submit">Entrar</button>
      </form>
      <div class="footer"></div>
    </div>
  </div>
  <script>
(function(){
  const t = localStorage.getItem('theme') || 'dark';
  if(t==='light') document.documentElement.setAttribute('data-theme','light');
  document.getElementById('themeToggle').addEventListener('click', ()=>{
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur==='light' ? '' : 'light';
    if(next) document.documentElement.setAttribute('data-theme','light'); else document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme', next?'light':'dark');
  });
})();
</script>
</body>
</html>
