<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>GameClub - Marketplace</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="game_club_cartridge_icon.ico">
<script src="utils.js" defer></script>
<script src="market.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="header card">
      <div class="brand">
        <div class="logo">
          <img src="logo.png" class="logo-img" alt="Logo GameClub">
        </div>
        <div>
          <div>GAMECLUB</div>
          <div class="small muted">Mercado de usados</div>
        </div>
      </div>
      <div class="header-right nav">
        <a class="badge" href="profile.html">Perfil</a>
        <a class="badge" href="myproducts.html">Meus Produtos</a>
        <a class="badge" href="cart.html">Carrinho</a>
        <button class="icon-btn" onclick="logout()">Sair</button>
        <button id="themeToggle" class="toggle">☀️/🌙</button>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h2>Marketplace</h2>
      <div id="productsList" class="grid-products" style="margin-top:12px"></div>
    </div>
  </div>
  <!-- ================= MODAL DE PRODUTO ================= -->
<div id="productModal" class="modal hidden">
  <div class="modal-content">
    <span class="close" id="closeModal">&times;</span>

    <img id="modalImage" class="modal-img">

    <h2 id="modalTitle"></h2>
    <p class="muted" id="modalCategory"></p>
    <p class="muted" id="modalPlatform"></p>
    <p id="modalDesc"></p>

    <div class="price-box">
      <strong id="modalPrice"></strong>
    </div>

    <button id="modalBuyBtn">Comprar</button>
  </div>
</div>

  <script>(function(){ const t=localStorage.getItem('theme')||'dark'; if(t==='light') document.documentElement.setAttribute('data-theme','light'); document.getElementById('themeToggle').addEventListener('click', ()=>{ const cur=document.documentElement.getAttribute('data-theme'); const next=cur==='light'?'':'light'; if(next) document.documentElement.setAttribute('data-theme','light'); else document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', next?'light':'dark'); }); })();</script>
  <script>
  (function(){
    const session = JSON.parse(localStorage.getItem("session"));
    if (!session) {
        alert("Você precisa fazer login para acessar o marketplace.");
        location.href = "index.html"; // página de login
    }
  })();
</script>

</body>
</html>
